seed: 42
device: cuda

ablation:
  use_light: true

data:
  root: data/train_runs
  sequences_dir: dataset
  #1,3,5帧消融
  frames_per_seq: 10
  image_size: [256, 256]
  image_key: shadow_mask.png
  batch_size: 2
  num_workers: 0

test:
  "data/test_runs"


model:
  num_frames: 10
  image_feat_dim: 256
  light_feat_dim: 128
  fused_dim: 256
  num_points: 2048

  # Simple Transformer Refiner 开关与配置
  use_refiner: false
  refiner_hidden_dim: 128
  refiner_blocks: 2
  refiner_num_heads: 4
  refiner_delta_scale: 0.05

loss:
  point_loss_type: apml

  # APML 主 loss
  apml_weight: 0.001
  apml_p_min: 0.8
  apml_sinkhorn_iters: 20

  # CD 在 APML 模式下不参与训练，只作为指标保留
  cd: 1.0

  center: 0.0
  bbox: 0.0
  bbox_radius: 1.0

  # 先只开 refiner  时，可以把 hd/repulsion 设 0。
  # 确认稳定后再逐步打开。
  hd: 0.00
  hd_top_ratio: 0.1
  repulsion: 0.005
  repulsion_radius: 0.03
  repulsion_k: 16

optim:
  lr: 5.0e-05    #0.0005
  weight_decay: 0.0
  epochs: 200

log:
  out_dir: outputs/train_runs/cnn-apml-150-5.0e-05
  print_every: 10
  save_every_epoch: 10
